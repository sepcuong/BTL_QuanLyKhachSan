services:
  apiuser:
    build:
      context: .
      dockerfile: APIUser/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Cuongdz: ${DB_CONNECTION_STRING:?Set DB_CONNECTION_STRING in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  apiadmin:
    build:
      context: .
      dockerfile: BTL_QuanLyKhachSan/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Cuongdz: ${DB_CONNECTION_STRING:?Set DB_CONNECTION_STRING in .env}
      AppSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AppSettings__Issuer: BTL_QuanLyKhachSan
      AppSettings__Audience: BTL_QuanLyKhachSan.Client
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Routes__0__DownstreamHostAndPorts__0__Host: apiuser
      Routes__0__DownstreamHostAndPorts__0__Port: "8080"
      Routes__1__DownstreamHostAndPorts__0__Host: apiadmin
      Routes__1__DownstreamHostAndPorts__0__Port: "8080"
      GlobalConfiguration__BaseUrl: http://localhost:5000
    ports:
      - "5000:8080"
    depends_on:
      - apiuser
      - apiadmin
    restart: unless-stopped